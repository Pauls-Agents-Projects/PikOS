[platformio]
default_envs = tc001

[env:tc001]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
board_build.embed_files = data/cert/x509_crt_bundle.bin
# The CH340 in some TC001 units can disappear during long 460800-baud writes.
# 115200 is slower but substantially more reliable for recovery and upgrades.
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    # FastLED 3.10.7 requires newer ESP-IDF C++ noexcept support and does not
    # compile with this pinned Arduino-ESP32 2.0.17 toolchain.
    fastled/FastLED@3.10.3
build_flags =
    -D PIXELOS_TC001
    # Give the TC001's single LED strip all eight hardware RMT memory blocks.
    # This cuts refill interrupts by 4x without the 24 KiB heap allocation of
    # FastLED's full-frame driver, reducing Wi-Fi-time colour corruption while
    # preserving the contiguous memory required by TLS and the settings UI.
    -D FASTLED_RMT_MEM_BLOCKS=8
    # SPIFFS/NVS writes pause code on both cores. Hold Espressif's flash lock
    # for each 7.7 ms LED transfer so a settings or icon write cannot interrupt
    # the waveform and leave one visibly corrupted frame latched on the panel.
    -D FASTLED_ESP32_FLASH_LOCK=1
    -D CORE_DEBUG_LEVEL=1
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Os
