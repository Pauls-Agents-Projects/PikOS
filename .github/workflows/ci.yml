name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install platformio
      - run: pio pkg install -e tc001
      - run: python3 tools/security_audit.py
      - run: python3 -m unittest discover -s tests -v
      - run: pio run
